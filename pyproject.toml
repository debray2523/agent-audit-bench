[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-audit-bench"
version = "0.2.0"
description = "Security controls for AI agents' tools, and a benchmark against CERT-In agentic AI audit checks"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Debendra Ray" }]
dependencies = []

[project.optional-dependencies]
langgraph = ["langgraph>=0.2"]
dev = ["pytest>=7", "langgraph>=0.2"]

[project.scripts]
agentaudit = "agentaudit.__main__:main"

[tool.setuptools.packages.find]
include = ["agentaudit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
