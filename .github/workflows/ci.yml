name: CI

on:
  push:
  pull_request:

# Least privilege: CI only needs to read the code.
permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[dev]"
      - run: python -m pytest -q
      - name: Harness smoke run (simulator)
        run: python -m agentaudit run --backend scripted --seeds 1 --out /tmp/sim
      - name: Examples (no model needed)
        run: |
          python examples/quickstart/quickstart.py
          python examples/langgraph_agent.py --demo
          python examples/function_calling_loop.py --demo
          python -m agentaudit policy-check examples/quickstart/policy.json --strict
